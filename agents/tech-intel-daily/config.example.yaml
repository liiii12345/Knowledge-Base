# 复制为 config.yaml 后填写。config.yaml 已在 .gitignore 中。
# 所有飞书 token / 群 ID / 代理地址均为占位符，不要提交真实值。

general:
  timezone: Asia/Shanghai
  lookback_hours: 24
  data_dir: data

proxy:
  enabled: false
  url: http://127.0.0.1:<PORT>
  auto_check: true
  check_timeout: 10

youtube:
  enabled: true
  lookback_hours: 24
  max_videos_per_podcast: 10
  channels:
    - name: Latent Space
      handle: "@LatentSpacePod"
      focus: AI 研究 / 工程实践 / 创业洞察
    - name: Training Data
      handle: "@GoogleDeepMind"
      focus: Google DeepMind 最新研究
    - name: No Priors
      handle: "@NoPriorsPodcast"
      focus: AI 创业 / 行业趋势
    - name: Unsupervised Learning
      handle: "@RedpointAI"
      focus: Redpoint Ventures 视角的 AI 投资
    - name: Data Driven NYC
      handle: "@DataDrivenNYC"
      focus: 数据科学与 AI 应用

twitter:
  enabled: true
  lookback_hours: 24
  max_tweets_per_account: 20
  # Nitter 实例稳定性差：单实例 + 浏览器 UA 比多实例轮询更可靠
  nitter_instances:
    - https://nitter.net
  accounts:
    - name: Andrej Karpathy
      handle: "@karpathy"
      domain: AI 教育 / 模型
    - name: Swyx
      handle: "@swyx"
      domain: AI Engineer 社区
    - name: Sam Altman
      handle: "@sama"
      domain: OpenAI
    - name: Guillermo Rauch
      handle: "@rauchg"
      domain: Vercel / 前端基建
    - name: Amjad Masad
      handle: "@amasad"
      domain: Replit / Agent 产品

analysis:
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  temperature: 0.3
  # 无 API key 时自动降级到模板合成模式（保证流水线永远能跑出一份完整日报）
  fallback_to_template: true

feishu:
  enabled: false
  app_id: "<YOUR_APP_ID>"
  app_secret: "<YOUR_APP_SECRET>"
  document_token: "<YOUR_DOCX_TOKEN>"
  chat_id: "<YOUR_CHAT_ID>"
  # 标题模板：飞书文档标题一旦写入不可更新，日期务必正确
  title_template: "科技情报日报 - {date}"

quality:
  # 质量红线：任一不通过则该条不入正文章节
  tweet_summary_min: 30
  tweet_summary_max: 80
  require_source: true
  require_link: true
  forbidden_phrases:
    - "这意味着"
    - "预示着"
    - "标志着"
    - "我们有理由相信"

dedupe:
  enabled: true
  window_size: 5000
