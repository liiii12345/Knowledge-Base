# 复制为 config.yaml 后填写。config.yaml 已在 .gitignore 中。
# 所有飞书 token / 群 ID / 代理地址均为占位符，不要提交真实值。

general:
  timezone: Asia/Shanghai
  lookback_hours: 24
  data_dir: data

proxy:
  enabled: false
  url: http://127.0.0.1:<PORT>
  auto_check: true
  check_timeout: 10

youtube:
  enabled: true
  lookback_hours: 24
  max_videos_per_podcast: 10
  channels:
    - name: Latent Space
      handle: "@LatentSpacePod"
      focus: AI 研究 / 工程实践 / 创业洞察
    - name: Training Data
      handle: "@GoogleDeepMind"
      focus: Google DeepMind 最新研究
    - name: No Priors
      handle: "@NoPriorsPodcast"
      focus: AI 创业 / 行业趋势
    - name: Unsupervised Learning
      handle: "@RedpointAI"
      focus: Redpoint Ventures 视角的 AI 投资
    - name: Data Driven NYC
      handle: "@DataDrivenNYC"
      focus: 数据科学与 AI 应用

twitter:
  enabled: true
  lookback_hours: 24
  max_tweets_per_account: 20
  # Nitter 实例稳定性差：单实例 + 浏览器 UA 比多实例轮询更可靠
