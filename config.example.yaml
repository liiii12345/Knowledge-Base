analysis:
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  temperature: 0.3
  # 无 API key 时自动降级到模板合成模式（保证流水线永远能跑出一份完整日报）
  fallback_to_template: true

feishu:
  enabled: false
  app_id: "<YOUR_APP_ID>"
  app_secret: "<YOUR_APP_SECRET>"
  document_token: "<YOUR_DOCX_TOKEN>"
  chat_id: "<YOUR_CHAT_ID>"
  # 标题模板：飞书文档标题一旦写入不可更新，日期务必正确
  title_template: "科技情报日报 - {date}"

quality:
  # 质量红线：任一不通过则该条不入正文章节
  tweet_summary_min: 30
  tweet_summary_max: 80
  require_source: true
  require_link: true
  forbidden_phrases:
    - "这意味着"
    - "预示着"
    - "标志着"
    - "我们有理由相信"

dedupe:
  enabled: true
  window_size: 5000
